name: Tag

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag name to create on the current main tip
        required: true
        default: v0.1.0
      notes:
        description: Release notes
        required: false
        default: First tagged release matching package version 0.1.0.

permissions:
  contents: write

jobs:
  tag:
    name: Create tag and GitHub release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Create annotated tag and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ inputs.tag }}"
          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "$tag"
          git push origin "$tag"
          gh release create "$tag" --target main --title "$tag" --notes "${{ inputs.notes }}"
