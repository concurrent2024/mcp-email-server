[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-email-server"
version = "0.1.0"
description = "An MCP server that sends and receives email over generic SMTP and IMAP."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp>=2.1,<3",
    "imap-tools>=1.15,<2",
    "pydantic>=2.9",
    "pydantic-settings>=2.10",
]

[project.optional-dependencies]
dev = [
    "mcp[cli]>=2.1,<3",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "anyio>=4.6",
    "aiosmtpd>=1.4.6",
    "ruff>=0.8",
]

[project.scripts]
mcp-email-server = "mcp_email.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_email"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "B", "UP", "SIM"]
# B006: the tools use [] defaults so their JSON schemas show an empty array
# rather than a nullable one; none of them mutate the argument.
ignore = ["E501", "B006"]

[tool.ruff.lint.isort]
known-first-party = ["mcp_email"]
known-local-folder = ["conftest", "test_smtp"]
